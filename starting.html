<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Starting — NYC Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/interstitial.css">
</head>
<body>
  <main class="interstitial" id="main">
    <h1 class="sr-only">Starting</h1>
    <div class="interstitial__spinner" aria-hidden="true"></div>
    <p class="interstitial__text" role="status" aria-live="polite" id="startingText">Starting&hellip;</p>
  </main>

  <script src="scripts/pillars.js"></script>
  <script src="scripts/interstitial.js"></script>
  <script>
    /* starting.html?pillar=<key> → "Starting <Pillar label>…" → that pillar's first screen. */
    (function () {
      Interstitial.show();
      var key = (new URLSearchParams(window.location.search)).get('pillar');
      if (!key || !Pillars.META[key]) { Interstitial.go('programs.html', 0); return; }
      document.getElementById('startingText').textContent = 'Starting ' + Pillars.labelFor(key) + '…';
      document.title = 'Starting ' + Pillars.labelFor(key) + ' — NYC Health';
      Interstitial.go(Pillars.entryFor(key));
    })();
  </script>
</body>
</html>
