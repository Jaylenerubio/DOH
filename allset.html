<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>You're all set — NYC Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/interstitial.css">
</head>
<body>
  <main class="interstitial" id="main">
    <div class="interstitial__check" id="allsetIcon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12 L10 17 L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="interstitial__warn" id="allsetWarn" aria-hidden="true" hidden><svg viewBox="0 0 24 24" fill="none"><path d="M12 9v4M12 17h.01M21.73 18 13.73 4a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h1 class="interstitial__title" id="allsetTitle">You&rsquo;re all set.</h1>
    <p class="interstitial__text" id="allsetText" role="status" aria-live="polite">Your client record is ready.</p>
    <div class="interstitial__actions" id="foundActions" hidden>
      <button class="btn btn--primary" type="button" id="continueExisting">Continue with existing record</button>
      <button class="btn btn--secondary" type="button" id="startNew">Start a new record</button>
    </div>
  </main>

  <script src="scripts/interstitial.js"></script>
  <script>
    (function () {
      Interstitial.show();
      var found = false;
      try { found = sessionStorage.getItem('nyc.recordFound') === '1'; } catch (e) {}
      if (!found) { Interstitial.go('programs.html', 1200); return; }
      /* Record found: ask before continuing. */
      var c = {}, id = '';
      try { c = JSON.parse(sessionStorage.getItem('nyc.contact') || '{}'); id = sessionStorage.getItem('nyc.recordId') || ''; } catch (e) {}
      document.getElementById('allsetIcon').hidden = true;
      document.getElementById('allsetWarn').hidden = false;
      document.getElementById('allsetTitle').textContent = 'We found an existing record';
      document.getElementById('allsetText').textContent =
        [(c.firstName || '') + ' ' + (c.lastName || '')].concat(id ? ['Record ' + id] : []).join(' · ').trim();
      document.title = 'Existing record found — NYC Health';
      document.getElementById('foundActions').hidden = false;
      document.getElementById('continueExisting').addEventListener('click', function () { window.location.href = 'programs.html'; });
      document.getElementById('startNew').addEventListener('click', function () {
        ['nyc.programs', 'nyc.completed', 'nyc.activity', 'nyc.df', 'nyc.hi', 'nyc.eap', 'nyc.tsu', 'nyc.recordFound']
          .forEach(function (k) { try { sessionStorage.removeItem(k); } catch (e) {} });
        window.location.href = 'programs.html';
      });
    })();
  </script>
</body>
</html>
